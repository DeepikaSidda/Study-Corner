<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} · Notes · Study Corner</title>
<script>(function(){var t=localStorage.getItem("lna-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.dataset.theme=t;})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700;800&display=swap">
<link rel="stylesheet" href="/static/style.css">
<script src="/static/app.js" defer></script>
<script src="/static/notes.js" defer></script>
</head>
<body class="doc-page">
<div class="read-progress no-print" id="rp"></div>
<nav class="nav no-print">
  <a class="brand" href="/">
    <span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5V6a2 2 0 0 1 2-2h12v14H6a2 2 0 0 0-2 2Z"/><path d="M8 4v14"/><path d="m12 8 4 2.5-4 2.5Z" fill="currentColor"/></svg></span>
    <span class="hide-sm">Study Corner</span>
  </a>
  <span class="nav-spacer"></span>
  <div class="nav-actions">
    <a class="btn btn-ghost btn-sm" href="/jobs/{{JOB_ID}}">← Back to the lecture</a>
    <button class="icon-btn" id="theme-toggle" type="button" aria-label="Switch theme">
      <svg class="theme-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
      <svg class="theme-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
</nav>

<div class="container doc-layout">
  <nav class="toc no-print" id="toc" aria-label="Contents"><b>Contents</b></nav>
  <div>
    <div class="doc-toolbar no-print">
      <span class="muted" id="read-time"></span>
      <div class="group">
        <button class="btn btn-sm" id="copy" type="button">Copy all text</button>
        <button class="btn btn-sm" id="print" type="button">Print</button>
        <a class="btn btn-sm btn-primary" href="/jobs/{{JOB_ID}}/files/notes.pdf">⬇ Download PDF</a>
      </div>
    </div>
    <article class="doc" id="doc">
{{DOC}}
    </article>
  </div>
</div>
</body>
</html>
